services:
  mongodb:
    image: mongo:7
    container_name: mongodb-servertech
    environment:
      TZ: Asia/Shanghai
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123456
      MONGO_INITDB_DATABASE: chat
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - servertech-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://root:root123456@127.0.0.1:27017/admin", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongodb-data:
    external: true
    name: serverchat-mongodb-data

networks:
  servertech-net:
    external: true
    name: servertech-net
