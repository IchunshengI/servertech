services:
  mysql:
    image: mysql:8.0
    container_name: mysql-servertech
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - servertech-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
    external: true
    name: serverchat-mysql-data

networks:
  servertech-net: {}
